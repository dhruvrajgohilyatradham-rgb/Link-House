<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Link Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1ef;
    --surface:#ffffff;
    --ink:#16211f;
    --ink-soft:#4b5b57;
    --muted:#8a9691;
    --line:#d7ddd9;
    --pine:#2f6f4f;
    --pine-deep:#1f4d37;
    --rust:#c4622d;
    --rust-soft:#f3e2d6;
    --ok:#2f6f4f;
    --err:#b3452f;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding:48px 20px 80px;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
  }

  /* ---------- header ---------- */
  header{
    margin-bottom:40px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.02em;
    margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(30px,5vw,42px);
    line-height:1.15;
    margin:0 0 12px;
    color:var(--pine-deep);
  }
  .sub{
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.6;
    max-width:52ch;
    margin:0;
  }

  /* ---------- search ---------- */
  .search-panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:28px;
  }
  .search-row{
    display:flex;
    align-items:center;
    border-bottom:2px solid var(--pine-deep);
    padding-bottom:10px;
    gap:10px;
  }
  .search-row svg{flex:none; color:var(--pine-deep);}
  #search{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Fraunces',serif;
    font-size:22px;
    color:var(--ink);
  }
  #search::placeholder{color:var(--muted); font-style:italic;}
  .clear-btn{
    border:none;
    background:none;
    color:var(--muted);
    cursor:pointer;
    font-size:13px;
    font-family:'IBM Plex Mono',monospace;
    padding:4px 6px;
    display:none;
  }
  .clear-btn.show{display:inline-block;}
  .clear-btn:hover{color:var(--rust);}

  .advanced-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-top:14px;
  }
  .mode-toggle{
    display:inline-flex;
    border:1px solid var(--line);
    border-radius:999px;
    overflow:hidden;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .mode-toggle button{
    border:none;
    background:var(--surface);
    color:var(--ink-soft);
    padding:6px 14px;
    cursor:pointer;
  }
  .mode-toggle button.active{
    background:var(--pine-deep);
    color:#fff;
  }
  .status-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }
  .status-line .num{color:var(--pine-deep); font-weight:500;}

  /* ---------- results ---------- */
  #results{
    display:flex;
    flex-direction:column;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .entry{
    background:var(--surface);
    padding:18px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .entry-city{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:500;
    color:var(--ink);
  }
  .entry-city mark{
    background:var(--rust-soft);
    color:var(--rust);
    padding:0 2px;
    border-radius:2px;
  }
  .link-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .link-row{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 10px;
  }
  .link-meta{flex:1; min-width:0;}
  .link-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.02em;
    color:var(--muted);
  }
  .link-url{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .copy-btn{
    flex:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    border:1px solid var(--pine-deep);
    color:var(--pine-deep);
    background:transparent;
    border-radius:999px;
    padding:6px 12px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .copy-btn:hover{background:var(--pine-deep); color:#fff;}
  .copy-btn.copied{
    background:var(--ok);
    border-color:var(--ok);
    color:#fff;
  }
  .copy-btn.empty{
    opacity:.4;
    cursor:not-allowed;
    border-color:var(--line);
    color:var(--muted);
  }
  .copy-btn.empty:hover{background:transparent; color:var(--muted);}

  /* ---------- states ---------- */
  .state-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .state-box .glyph{
    font-family:'Fraunces',serif;
    font-size:26px;
    color:var(--pine-deep);
    margin-bottom:8px;
  }
  .state-box p{margin:0 0 6px; font-size:14px; line-height:1.6;}
  .retry-btn{
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    border:1px solid var(--rust);
    color:var(--rust);
    background:transparent;
    border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
  }
  .retry-btn:hover{background:var(--rust); color:#fff;}

  @media (prefers-reduced-motion:no-preference){
    .entry, .copy-btn{transition:background .15s, color .15s;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">CITY LINK ATLAS</p>
    <h1>Find a city, copy its links.</h1>
    <p class="sub">Searches your live sheet in real time. Type part of a city name — word order and spelling gaps don't matter.</p>
  </header>

  <div class="search-panel">
    <div class="search-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Try “srisailam” or “sri lam”" autocomplete="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn">clear ✕</button>
    </div>
    <div class="advanced-row">
      <div class="mode-toggle" id="modeToggle">
        <button data-mode="and" class="active">match all words</button>
        <button data-mode="or">match any word</button>
      </div>
      <div class="status-line" id="statusLine">loading sheet…</div>
    </div>
  </div>

  <div id="results"></div>
</div>

<script>
(function(){
  var SHEET_ID = "1XwkaYRSctgUlaVDsFHk46BNTiZf7TDgyIMLsn018sU4";
  var BASE = "https://opensheet.elk.sh/" + SHEET_ID + "/";
  // opensheet needs a sheet name or index after the id — try the most likely ones in order.
  var CANDIDATES = [BASE, BASE + "1", BASE + "Sheet1"];

  var resultsEl = document.getElementById('results');
  var statusEl = document.getElementById('statusLine');
  var searchEl = document.getElementById('search');
  var clearBtn = document.getElementById('clearBtn');
  var modeToggle = document.getElementById('modeToggle');

  var allData = [];
  var mode = 'and';
  var debounceTimer = null;

  function clean(str){
    return (str || '').toString().replace(/\s+/g, ' ').trim();
  }

  function escapeHtml(str){
    return (str || '').toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function highlight(text, tokens){
    var safe = escapeHtml(text);
    if(!tokens.length) return safe;
    var pattern = tokens
      .map(function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); })
      .join('|');
    try{
      var re = new RegExp('(' + pattern + ')', 'ig');
      return safe.replace(re, '<mark>$1</mark>');
    }catch(e){ return safe; }
  }

  async function loadData(){
    statusEl.textContent = 'loading sheet…';
    resultsEl.innerHTML = '';
    for(var i=0; i<CANDIDATES.length; i++){
      try{
        var res = await fetch(CANDIDATES[i], { cache: 'no-store' });
        if(!res.ok) continue;
        var data = await res.json();
        if(Array.isArray(data) && data.length && ('City' in data[0])){
          allData = data;
          statusEl.textContent = allData.length + ' cities loaded';
          render('');
          return;
        }
      }catch(e){ /* try next candidate */ }
    }
    showError();
  }

  function showError(){
    statusEl.textContent = 'could not load sheet';
    resultsEl.innerHTML =
      '<div class="state-box">' +
        '<div class="glyph">⚠</div>' +
        '<p>The sheet didn\'t come back as expected.</p>' +
        '<p>Check that it\'s shared as “Anyone with the link can view” and that the sheet name is right.</p>' +
        '<button class="retry-btn" id="retryBtn">Try again</button>' +
      '</div>';
    document.getElementById('retryBtn').addEventListener('click', loadData);
  }

  function rankEntry(city, query, tokens){
    var c = city.toLowerCase();
    var q = query.toLowerCase();
    if(c === q) return 0;
    if(c.indexOf(q) === 0) return 1;
    return 2;
  }

  function matches(city, tokens){
    var c = city.toLowerCase();
    if(!tokens.length) return true;
    if(mode === 'and'){
      return tokens.every(function(t){ return c.indexOf(t) !== -1; });
    }
    return tokens.some(function(t){ return c.indexOf(t) !== -1; });
  }

  function render(query){
    var q = clean(query);
    var tokens = q.toLowerCase().split(/\s+/).filter(Boolean);

    var filtered = allData.filter(function(row){
      return matches(clean(row.City), tokens);
    });

    filtered.sort(function(a, b){
      var ra = rankEntry(clean(a.City), q, tokens);
      var rb = rankEntry(clean(b.City), q, tokens);
      if(ra !== rb) return ra - rb;
      return clean(a.City).localeCompare(clean(b.City));
    });

    statusEl.innerHTML = tokens.length
      ? '<span class="num">' + filtered.length + '</span> of ' + allData.length + ' cities'
      : allData.length + ' cities loaded';

    if(!allData.length) return;

    if(!filtered.length){
      resultsEl.innerHTML =
        '<div class="state-box">' +
          '<div class="glyph">∅</div>' +
          '<p>No city matches “' + escapeHtml(q) + '”.</p>' +
          '<p>Try fewer words, or switch to “match any word”.</p>' +
        '</div>';
      return;
    }

    resultsEl.innerHTML = filtered.map(function(row, idx){
      var city = clean(row.City) || 'Untitled';
      var pageLabel = clean(row.PageHead) || 'Page link';
      var roomLabel = clean(row.RoomHeaad || row.RoomHead) || 'Room link';
      var pageUrl = clean(row.Page);
      var roomUrl = clean(row.Room);

      return (
        '<div class="entry">' +
          '<div class="entry-city">' + highlight(city, tokens) + '</div>' +
          '<div class="link-list">' +
            linkRow(idx, 'page', pageLabel, pageUrl) +
            linkRow(idx, 'room', roomLabel, roomUrl) +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  function linkRow(idx, kind, label, url){
    var hasUrl = !!url;
    var display = hasUrl ? url : 'not provided';
    return (
      '<div class="link-row">' +
        '<div class="link-meta">' +
          '<div class="link-label">' + escapeHtml(label.toUpperCase()) + '</div>' +
          '<div class="link-url">' + escapeHtml(display) + '</div>' +
        '</div>' +
        '<button class="copy-btn' + (hasUrl ? '' : ' empty') + '" ' +
          'data-idx="' + idx + '" data-kind="' + kind + '" ' +
          (hasUrl ? '' : 'disabled') + '>copy</button>' +
      '</div>'
    );
  }

  async function copyText(text, btn){
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      var original = btn.textContent;
      btn.textContent = 'copied ✓';
      btn.classList.add('copied');
      setTimeout(function(){
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1400);
    }catch(e){
      btn.textContent = 'failed';
      setTimeout(function(){ btn.textContent = 'copy'; }, 1400);
    }
  }

  resultsEl.addEventListener('click', function(e){
    var btn = e.target.closest('.copy-btn');
    if(!btn || btn.disabled) return;
    var idx = Number(btn.getAttribute('data-idx'));
    var kind = btn.getAttribute('data-kind');
    var q = clean(searchEl.value);
    var tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
    var filtered = allData.filter(function(row){ return matches(clean(row.City), tokens); });
    filtered.sort(function(a, b){
      var ra = rankEntry(clean(a.City), q, tokens);
      var rb = rankEntry(clean(b.City), q, tokens);
      if(ra !== rb) return ra - rb;
      return clean(a.City).localeCompare(clean(b.City));
    });
    var row = filtered[idx];
    if(!row) return;
    var url = kind === 'page' ? clean(row.Page) : clean(row.Room);
    if(url) copyText(url, btn);
  });

  searchEl.addEventListener('input', function(){
    clearBtn.classList.toggle('show', !!searchEl.value);
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function(){ render(searchEl.value); }, 120);
  });

  clearBtn.addEventListener('click', function(){
    searchEl.value = '';
    clearBtn.classList.remove('show');
    render('');
    searchEl.focus();
  });

  modeToggle.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-mode]');
    if(!btn) return;
    mode = btn.getAttribute('data-mode');
    Array.from(modeToggle.children).forEach(function(b){
      b.classList.toggle('active', b === btn);
    });
    render(searchEl.value);
  });

  loadData();
})();
</script>

</body>
</html>
